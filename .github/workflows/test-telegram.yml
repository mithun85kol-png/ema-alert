name: Test Telegram
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "token length: ${#T}"
          echo "has colon: $([[ "$T" == *:* ]] && echo yes || echo no)"
          echo "chat id length: ${#C}"
          curl -sS "https://api.telegram.org/bot${T}/getMe"
