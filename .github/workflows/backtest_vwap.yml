name: Backtest VWAP

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days of history"
        default: "90"
      limit:
        description: "First N F&O stocks (0 = all)"
        default: "20"
      tf:
        description: "Candle minutes (15, 30, 60, 75)"
        default: "15"
      cost_pct:
        description: "Round-trip cost per trade in %"
        default: "0.1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run VWAP backtest
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
        run: python backtest_vwap.py --days "${{ github.event.inputs.days }}" --limit "${{ github.event.inputs.limit }}" --tf "${{ github.event.inputs.tf }}" --cost-pct "${{ github.event.inputs.cost_pct }}" | tee backtest_vwap_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-vwap-result
          path: |
            backtest_vwap_summary.txt
            backtest_vwap_trades.csv
