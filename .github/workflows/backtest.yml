name: Backtest

# Manual only: Actions tab -> Backtest -> Run workflow
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many calendar days of history (max ~90 is sensible)"
        default: "60"
      limit:
        description: "Only the first N F&O stocks (0 = all). Use 20 for a quick test."
        default: "20"
      cost_pct:
        description: "Round-trip cost per trade in % (e.g. 0.1)"
        default: "0.1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python backtest.py --days "${{ github.event.inputs.days }}" --limit "${{ github.event.inputs.limit }}" --cost-pct "${{ github.event.inputs.cost_pct }}" | tee backtest_summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-result
          path: |
            backtest_summary.txt
            backtest_trades.csv
