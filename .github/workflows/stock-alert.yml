name: Nifty50 Stock Alert Bot

on:
  schedule:
    # Every 30 minutes during NSE hours - catches each new 75-min candle
    # close within ~30 min, without hardcoding an exact 75-min interval.
    - cron: '*/30 3-9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock alert check
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_stocks.py

      - name: Commit updated alert state (if changed)
        run: |
          git config user.name "ema-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update alert state [skip ci]"
            git pull --rebase origin main
            git push
          fi
