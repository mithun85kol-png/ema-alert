name: Test Telegram
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "token length: ${#T}"
          echo "chat id length: ${#C}"
          curl -sS --fail-with-body "https://api.telegram.org/bot${T}/sendMessage" \
            -d chat_id="${C}" \
            -d text="Test message from GitHub Actions"
