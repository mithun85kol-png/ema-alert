name: EMA Alert Scan

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "ema-alert-bot"
          git config user.email "actions@github.com"
          git add alert_state.json
          if [ -f pivot_cache.json ]; then git add pivot_cache.json; fi
          git diff --cached --quiet || git commit -m "update alert state [skip ci]"
          git push
