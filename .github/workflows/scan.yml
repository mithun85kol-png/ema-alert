name: EMA Alert Bot

on:
  schedule:
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-17 * * 1-5'
    - cron: '0 18 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EMA alert check
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Commit updated alert state (if changed)
        run: |
          git config user.name "ema-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update alert state [skip ci]"
            git pull --rebase origin main
            git push
          fi
