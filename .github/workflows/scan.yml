name: EMA Alert Scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode: full (F&O+cash+commodity, 75-min) or index (NIFTY50/BANK/SENSEX only, 5-min)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - index
  repository_dispatch:
    types: [run-scan]

concurrency:
  group: ema-alert-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "ema-alert-bot"
          git config user.email "actions@github.com"
          git add alert_state.json
          if [ -f pivot_cache.json ]; then git add pivot_cache.json; fi
          git diff --cached --quiet || git commit -m "update alert state [skip ci]"
          git push
